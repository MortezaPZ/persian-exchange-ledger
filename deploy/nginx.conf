# Install inside nginx's http context (sites-enabled on Debian/Ubuntu).
# Replace the reserved domain and provision certificates BEFORE nginx -t.
server {
    listen 80;
    server_name accounts.example.invalid;
    return 301 https://accounts.example.invalid$request_uri;
}

server {
    listen 443 ssl;
    server_name accounts.example.invalid;
    ssl_certificate /etc/letsencrypt/live/accounts.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/accounts.example.invalid/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 10m;

    # Never alias the data directory or uploads to a public URL.
    location ^~ /media/ { return 404; }
    location ^~ /payment_receipts/ { return 404; }

    # WhiteNoise serves collected static files; Django serves private receipts.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_cache off;
        proxy_read_timeout 120s;
    }
}
